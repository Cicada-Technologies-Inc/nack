name: build-image-fork

on:
  push:
    branches:
      - main
      - feat/**
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref to build (empty builds the workflow revision)
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nack-jetstream-controller
  DEV_ECR_REGISTRY: 916491057812.dkr.ecr.us-west-2.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve source revision
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # One binary per architecture, straight into the build context. The
      # Dockerfile picks by TARGETARCH, so the names matter.
      - name: Cross-compile jetstream-controller (linux/amd64, linux/arm64)
        env:
          SOURCE_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -tags timetzdata \
              -ldflags "-s -w \
                -X main.Version=$SOURCE_SHA \
                -X main.GitInfo=$SOURCE_SHA \
                -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%S%z)" \
              -o jetstream-controller-$arch \
              ./cmd/jetstream-controller
          done
          file jetstream-controller-amd64 jetstream-controller-arm64
          # The toolchain that actually compiled them: go.mod's toolchain line,
          # not its go line, which is only the minimum language version.
          go version jetstream-controller-amd64 jetstream-controller-arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure dev AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::916491057812:role/github-actions-app-runner
          aws-region: us-west-2

      - name: Log in to dev ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DEV_ECR_REGISTRY }}/nack-jetstream-controller
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=ref,event=tag,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=${{ steps.source.outputs.short_sha }},priority=1000
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The Dockerfile has RUN steps (apk add, adduser, chmod), and those
      # execute inside the target platform's container. Building linux/arm64 on
      # an amd64 runner therefore needs binfmt emulation registered first, or
      # the arm64 half fails with "exec format error" during the build itself.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cicd/Dockerfile.copy
          # Publishing an index rather than a single-architecture image. An
          # amd64 consumer keeps pulling exactly what it pulled before; an arm64
          # cluster stops failing with "exec format error".
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Print pull command
        run: |
          echo "Image pushed. Pull with one of:"
          echo "${{ steps.meta.outputs.tags }}"
