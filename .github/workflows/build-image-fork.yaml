name: build-image-fork

on:
  push:
    branches:
      - main
      - feat/**
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref to build (empty builds the workflow revision)
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nack-jetstream-controller
  DEV_ECR_REGISTRY: 916491057812.dkr.ecr.us-west-2.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.source.outputs.short_sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve source revision
        id: source
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # One binary per architecture, straight into the build context. The
      # Dockerfile picks by TARGETARCH, so the names matter.
      - name: Cross-compile jetstream-controller (linux/amd64, linux/arm64)
        env:
          SOURCE_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -tags timetzdata \
              -ldflags "-s -w \
                -X main.Version=$SOURCE_SHA \
                -X main.GitInfo=$SOURCE_SHA \
                -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%S%z)" \
              -o jetstream-controller-$arch \
              ./cmd/jetstream-controller
          done
          file jetstream-controller-amd64 jetstream-controller-arm64
          # The toolchain that actually compiled them: go.mod's toolchain line,
          # not its go line, which is only the minimum language version.
          go version jetstream-controller-amd64 jetstream-controller-arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure dev AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::916491057812:role/github-ecr-nack-publisher
          aws-region: us-west-2
          allowed-account-ids: '916491057812'

      - name: Log in to dev ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DEV_ECR_REGISTRY }}/nack-jetstream-controller
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=ref,event=tag,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=${{ steps.source.outputs.short_sha }},priority=1000
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The Dockerfile has RUN steps (apk add, adduser, chmod), and those
      # execute inside the target platform's container. Building linux/arm64 on
      # an amd64 runner therefore needs binfmt emulation registered first, or
      # the arm64 half fails with "exec format error" during the build itself.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cicd/Dockerfile.copy
          # Publishing an index rather than a single-architecture image. An
          # amd64 consumer keeps pulling exactly what it pulled before; an arm64
          # cluster stops failing with "exec format error".
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false

      - name: Print pull command
        run: |
          echo "Image pushed. Pull with one of:"
          echo "${{ steps.meta.outputs.tags }}"

  promote-ats-prod:
    name: Promote the tested index to ATS production
    needs: build-and-push
    if: >-
      github.repository == 'Cicada-Technologies-Inc/nack' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ats-prod
    permissions:
      id-token: write
    concurrency:
      group: nack-ats-prod-${{ github.sha }}
      cancel-in-progress: false
    env:
      ECR_IMAGE: nack-jetstream-controller
      SOURCE_TAG: ${{ needs.build-and-push.outputs.short_sha }}
      INDEX_DIGEST: ${{ needs.build-and-push.outputs.digest }}
    steps:
      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: v0.7.1
      - name: Authenticate to ATS DEV
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::916491057812:role/github-ecr-nack-ats-prod-source
          aws-region: us-west-2
          allowed-account-ids: '916491057812'
      - uses: aws-actions/amazon-ecr-login@v2
        id: source
      - name: Verify the index published by this build
        id: verify
        env:
          SOURCE_REGISTRY: ${{ steps.source.outputs.registry }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^[0-9a-f]{7}$ && "$SOURCE_TAG" == "${GITHUB_SHA:0:7}" ]]
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          repo="$SOURCE_REGISTRY/$ECR_IMAGE"
          [[ "$(regctl image digest "$repo:$SOURCE_TAG")" == "$INDEX_DIGEST" ]]
          arm64=$(regctl manifest get "$repo@$INDEX_DIGEST" --format raw-body |
            jq -er --arg sha "$GITHUB_SHA" --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" '
              select(.annotations["org.opencontainers.image.revision"] == $sha and
                     .annotations["org.opencontainers.image.source"] == $source)
              | [.manifests[] | select(.platform.os == "linux") | {arch: .platform.architecture, digest}]
              | sort_by(.arch)
              | select(map(.arch) == ["amd64", "arm64"])
              | .[1].digest | select(test("^sha256:[0-9a-f]{64}$"))
            ')
          printf 'arm64=%s\n' "$arm64" >> "$GITHUB_OUTPUT"
      - name: Authenticate to ATS production
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::903539458131:role/github-ecr-nack-publisher
          aws-region: us-west-2
          allowed-account-ids: '903539458131'
      - uses: aws-actions/amazon-ecr-login@v2
        id: target
      - name: Copy the verified index and ARM64 tag
        env:
          SOURCE_REGISTRY: ${{ steps.source.outputs.registry }}
          TARGET_REGISTRY: ${{ steps.target.outputs.registry }}
          ARM64_DIGEST: ${{ steps.verify.outputs.arm64 }}
        run: |
          set -euo pipefail
          source="$SOURCE_REGISTRY/$ECR_IMAGE"
          target="$TARGET_REGISTRY/$ECR_IMAGE"

          publish_tag() {
            local tag="$1" digest="$2" current
            if current=$(aws ecr describe-images --repository-name "$ECR_IMAGE" \
              --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text 2>&1); then
              [[ "$current" == "$digest" ]]
              return
            fi
            if [[ "$current" != *ImageNotFoundException* ]]; then
              printf '%s\n' "$current" >&2
              return 1
            fi
            regctl image copy "$source@$digest" "$target:$tag"
            [[ "$(regctl image digest "$target:$tag")" == "$digest" ]]
          }

          publish_tag "$SOURCE_TAG" "$INDEX_DIGEST"
          publish_tag "$SOURCE_TAG-arm64" "$ARM64_DIGEST"
          printf 'ATS DEV and PROD share index `%s`.\n' "$INDEX_DIGEST" >> "$GITHUB_STEP_SUMMARY"
